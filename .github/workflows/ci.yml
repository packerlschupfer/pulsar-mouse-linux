name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-import:
    name: Lint & import check
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-usb \
            python3-gi \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            gir1.2-dbusmenu-glib-0.4

      - name: Syntax check
        run: |
          for f in src/pulsar_mouse/*.py src/pulsar_mouse/drivers/*.py; do
            python3 -m py_compile "$f"
          done
          echo "Syntax OK"

      - name: Import check (backend)
        env:
          PYTHONPATH: src
        run: |
          python3 -c "
          from pulsar_mouse import scan_devices, find_device, __version__
          from pulsar_mouse.base import PulsarDevice, DeviceCapabilities
          from pulsar_mouse.hid import describe_button, parse_button_function
          from pulsar_mouse.drivers import discover_all
          from pulsar_mouse.drivers.x2a import PulsarX2A
          print(f'Backend imports OK — v{__version__}')
          drivers = discover_all()
          print(f'Drivers: {list(drivers)}')
          for name, cls in drivers.items():
              assert hasattr(cls, 'capabilities'), f'{name} missing capabilities'
              assert cls.capabilities.vid_pid_pairs, f'{name} has no VID/PID pairs'
          print(f'All {len(drivers)} drivers registered correctly')
          print(f'X2A caps: {PulsarX2A.capabilities.name}')
          "

      - name: Import check (GUI — no display needed)
        run: |
          python3 -c "
          import gi
          gi.require_version('Gtk', '4.0')
          gi.require_version('Adw', '1')
          gi.require_version('Dbusmenu', '0.4')
          from gi.repository import Gtk, Adw, GLib, Gio, Dbusmenu
          print('GUI imports OK')
          "
