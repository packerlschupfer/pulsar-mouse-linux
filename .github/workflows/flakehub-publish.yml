name: Publish to FlakeHub

on:
  push:
    branches:
      - feinmann8k-driver
  workflow_dispatch: {}

jobs:
  flakehub-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/flakehub-push@main
        with:
          rolling: true
          visibility: public
